<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanishing Typing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      color: #eee;
      cursor: text;
    }

    #hint {
      position: fixed;
      top: 30px;
      font-size: 13px;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: opacity 1s;
    }

    #hint.hidden {
      opacity: 0;
    }

    #display {
      width: 80vw;
      max-width: 900px;
      min-height: 60px;
      font-size: clamp(20px, 3vw, 36px);
      line-height: 1.7;
      text-align: center;
      word-break: break-word;
      color: #e8e0d0;
      letter-spacing: 0.03em;
      transition: opacity 0.8s ease;
      opacity: 1;
    }

    #display.fade {
      opacity: 0;
    }

    #timer-bar-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #111;
    }

    #timer-bar {
      height: 100%;
      width: 100%;
      background: #7c6fff;
      transform-origin: left;
      transition: transform linear;
    }

    /* hidden real textarea */
    #input {
      position: fixed;
      opacity: 0;
      width: 1px;
      height: 1px;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <div id="hint">Start with any sentence</div>
  <div id="display"></div>
  <div id="timer-bar-wrap">
    <div id="timer-bar"></div>
  </div>
  <textarea id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  <script>
    const display = document.getElementById('display');
    const input = document.getElementById('input');
    const hint = document.getElementById('hint');
    const timerBar = document.getElementById('timer-bar');

    const FADE_DELAY = 2000; // ms

    let fadeTimeout = null;
    let barTimeout = null;
    let started = false;

    // Keep focus on hidden textarea
    document.addEventListener('click', () => input.focus());
    document.addEventListener('keydown', () => input.focus());
    input.focus();

    input.addEventListener('input', () => {
      if (!started) {
        started = true;
        hint.classList.add('hidden');
      }

      // Show text
      display.textContent = input.value;
      display.classList.remove('fade');

      // Reset bar
      clearTimeout(barTimeout);
      timerBar.style.transition = 'none';
      timerBar.style.transform = 'scaleX(1)';

      // Animate bar going down over FADE_DELAY
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          timerBar.style.transition = `transform ${FADE_DELAY}ms linear`;
          timerBar.style.transform = 'scaleX(0)';
        });
      });

      // Reset fade timer
      clearTimeout(fadeTimeout);
      fadeTimeout = setTimeout(() => {
        display.classList.add('fade');
        // Clear textarea after fade
        setTimeout(() => {
          input.value = '';
          display.textContent = '';
          display.classList.remove('fade');
        }, 800);
      }, FADE_DELAY);
    });
  </script>
</body>
</html>
