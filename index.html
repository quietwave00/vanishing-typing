<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanishing Typing</title>
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <div id="cycle-flash" class="cycle-flash" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="site-header">
      <div>
        <h1 class="site-title">Vanishing Typing</h1>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <button class="nav-link is-active" type="button" data-screen-target="typing">메인</button>
        <button class="nav-link" type="button" data-screen-target="write">입력</button>
        <button class="nav-link" type="button" data-screen-target="review">복습</button>
      </nav>
    </header>

    <main class="screen-stack">
      <section class="screen screen--active" data-screen="typing" aria-labelledby="typing-title">
        <div class="typing-screen">
          <div class="typing-meta">
            <p id="hint" class="typing-hint">Start with any sentence</p>
            <h2 id="typing-title" class="screen-title"></h2>
          </div>

          <div id="display" class="typing-display" aria-live="polite"></div>

          <div class="timer-bar-wrap" aria-hidden="true">
            <div id="timer-bar" class="timer-bar"></div>
          </div>

          <textarea
            id="input"
            class="sr-only-input"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          ></textarea>
        </div>
      </section>

      <section class="screen" data-screen="write" aria-labelledby="write-title" hidden>
        <div class="editor-screen">
          <div class="panel-header">
            <div>
              <p class="placeholder-label">Daily Input</p>
              <h2 id="write-title" class="screen-title">학습 문장 입력</h2>
            </div>
          </div>

          <form id="study-set-form" class="study-form">
            <div class="field-grid">
              <label class="field">
                <span class="field-label">날짜</span>
                <input id="study-date" name="dateKey" class="field-input" type="date" required>
              </label>

              <label class="field">
                <span class="field-label">카테고리</span>
                <input
                  id="study-category"
                  name="category"
                  class="field-input"
                  type="text"
                  required
                >
              </label>
            </div>

            <label class="field">
              <span class="field-label">문장 목록</span>
              <textarea
                id="study-sentences"
                name="sentences"
                class="field-input field-textarea"
                placeholder="문장 하나당 한 줄씩 입력하세요."
                required
              ></textarea>
            </label>

            <div class="form-actions">
              <button id="save-study-set" class="primary-button" type="submit">Firestore에 저장</button>
              <p id="form-status" class="form-status" aria-live="polite"></p>
            </div>
          </form>
        </div>
      </section>

      <section class="screen" data-screen="review" aria-labelledby="review-title" hidden>
        <div class="editor-screen">
          <div class="panel-header">
            <div>
              <p class="placeholder-label">Review</p>
              <h2 id="review-title" class="screen-title">복습 화면</h2>
            </div>
          </div>

          <div class="field-grid">
            <label class="field">
              <span class="field-label">날짜 필터</span>
              <select id="review-date-filter" class="field-input">
                <option value="">전체 날짜</option>
              </select>
            </label>

            <label class="field">
              <span class="field-label">카테고리 필터</span>
              <select id="review-category-filter" class="field-input">
                <option value="">전체 카테고리</option>
              </select>
            </label>
          </div>

          <div class="form-actions">
            <div class="button-row">
              <button id="start-sequential-review" class="primary-button" type="button">순차 시작</button>
              <button id="start-shuffle-review" class="secondary-button" type="button">셔플 시작</button>
            </div>
            <p id="review-filter-status" class="form-status" aria-live="polite"></p>
          </div>

          <section class="review-results">
            <div class="panel-header">
              <div>
                <p class="placeholder-label">Selected Sentences</p>
                <h3 class="subsection-title">복습 대상</h3>
              </div>
              <p id="review-result-count" class="status-subnote">문장을 불러오는 중입니다.</p>
            </div>

            <div id="review-empty" class="empty-state">
              복습할 문장이 없습니다.
            </div>

            <ol id="review-results-list" class="saved-list" hidden></ol>
          </section>
        </div>
      </section>
    </main>
  </div>

  <!-- FIREBASE_CONFIG_BOOTSTRAP -->
  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
