name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -R styles dist/styles
          mkdir -p dist/scripts/config
          cp -R scripts/data dist/scripts/data
          cp -R scripts/services dist/scripts/services
          cp scripts/app.js dist/scripts/app.js
          cp scripts/vanishing-typing.js dist/scripts/vanishing-typing.js
          touch dist/.nojekyll

      - name: Generate Firebase config script
        shell: bash
        run: |
          cat <<EOF > dist/scripts/config/firebase-config.js
          window.__FIREBASE_CONFIG__ = {
            firebaseProjectConfig: {
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ secrets.FIREBASE_APP_ID }}',
            },
            firebaseSdkUrls: {
              app: 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js',
              firestore: 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js',
            },
          };
          EOF

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/scripts/app.js
          test -f dist/scripts/config/firebase-config.js
          ls -R dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
